kind = "web"
previewPath = "/"
title = "Sam Books Control Tower"
description = "Operational monitoring and governance for Sam Books, with connected queue metrics, honest journey coverage, redacted failure evidence and preserved approval workflows."
version = "1.0.0"
id = "artifacts/authorization-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24871

[services.development]
run = "pnpm --filter @workspace/authorization-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/authorization-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/authorization-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24871"
BASE_PATH = "/"
