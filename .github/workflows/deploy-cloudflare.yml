# Deploy Control Tower to Cloudflare (Worker + static SPA + API container) on
# every push to main, or manually from the Actions tab.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit +
# Containers: Edit on the account in artifacts/cloudflare-edge/wrangler.jsonc).
# App secrets (DATABASE_URL, SESSION_SECRET, ...) already live on the Worker;
# deploys keep them, so they are not stored in GitHub.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a running one finish.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck Worker
        run: pnpm --filter @workspace/cloudflare-edge run typecheck

      # Builds the SPA, builds and pushes the API image (Docker is preinstalled
      # on ubuntu-latest), then deploys the Worker and container.
      - name: Deploy
        run: pnpm --filter @workspace/cloudflare-edge run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
