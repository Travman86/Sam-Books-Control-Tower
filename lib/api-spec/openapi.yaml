openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Authorization hub overview
  - name: projects
    description: Connected Replit projects
  - name: features
    description: Feature-level controls and policies
  - name: reviews
    description: Human review queue and sign-offs
  - name: activity
    description: Audit trail
  - name: management
    description: Project management actions requiring authorization
  - name: sam-books
    description: Read-only proxy into the connected Sam Books instance's own Control Tower API
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get authorization hub summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List connected projects
      responses:
        "200":
          description: Connected projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Connect a Replit project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Connected project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a connected project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Connected project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/revoke:
    post:
      operationId: revokeProject
      tags: [projects]
      summary: Revoke a project's connection
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Revoked project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /features:
    get:
      operationId: listFeatures
      tags: [features]
      summary: List feature authorization policies
      parameters:
        - in: query
          name: projectId
          schema:
            type: [string, "null"]
      responses:
        "200":
          description: Feature policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feature"
    post:
      operationId: createFeature
      tags: [features]
      summary: Create a gated feature policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureInput"
      responses:
        "201":
          description: Feature policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List change requests awaiting human review
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
      responses:
        "200":
          description: Review requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
  /reviews/{reviewId}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: Get a review request
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Review request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    patch:
      operationId: decideReview
      tags: [reviews]
      summary: Approve or reject a change request
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Decided review request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent authorization activity
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /management-actions:
    get:
      operationId: listManagementActions
      tags: [management]
      summary: List proposed project management actions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: projectId
          schema:
            type: string
      responses:
        "200":
          description: Project management actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagementAction"
    post:
      operationId: createManagementAction
      tags: [management]
      summary: Propose a project management action for approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementActionInput"
      responses:
        "201":
          description: Proposed project management action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementAction"
  /management-actions/{actionId}:
    get:
      operationId: getManagementAction
      tags: [management]
      summary: Get a project management action
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Project management action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementAction"
    patch:
      operationId: decideManagementAction
      tags: [management]
      summary: Approve or reject a project management action
      parameters:
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementActionDecision"
      responses:
        "200":
          description: Decided project management action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementAction"
  /management-actions/ai-draft:
    post:
      operationId: draftManagementAction
      tags: [management]
      summary: Use AI to draft an action's fields from a one-line request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementActionAiDraftInput"
      responses:
        "200":
          description: Drafted action fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementActionAiDraft"
        "502":
          description: AI drafting is not configured or the model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sam-books/overview:
    get:
      operationId: getSamBooksOverview
      tags: [sam-books]
      summary: Sam Books platform overview
      responses:
        "200":
          description: Sam Books overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamBooksOverview"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/projects:
    get:
      operationId: listSamBooksProjects
      tags: [sam-books]
      summary: Sam Books custom modules across every organization
      responses:
        "200":
          description: Sam Books projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SamBooksProject"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/feature-requests/{featureRequestId}:
    get:
      operationId: getSamBooksFeatureRequest
      tags: [sam-books]
      summary: Sam Books feature-request detail
      parameters:
        - $ref: "#/components/parameters/SamBooksFeatureRequestId"
      responses:
        "200":
          description: Sam Books feature request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamBooksFeatureRequestDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/feature-requests/{featureRequestId}/decision:
    post:
      operationId: decideSamBooksFeatureRequest
      tags: [sam-books]
      summary: Approve, reject, or request changes on a Sam Books feature request
      parameters:
        - $ref: "#/components/parameters/SamBooksFeatureRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamBooksFeatureRequestDecision"
      responses:
        "200":
          description: Decided feature request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamBooksFeatureRequestDecisionResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request was already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/agent-runs/{agentRunId}:
    get:
      operationId: getSamBooksAgentRun
      tags: [sam-books]
      summary: Sam Books agent-run detail
      parameters:
        - $ref: "#/components/parameters/SamBooksAgentRunId"
      responses:
        "200":
          description: Sam Books agent run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamBooksAgentRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/feature-requests:
    get:
      operationId: listSamBooksFeatureRequests
      tags: [sam-books]
      summary: Sam Books feature-request approval queue
      parameters:
        - in: query
          name: status
          schema:
            type: string
            default: submitted
      responses:
        "200":
          description: Sam Books feature requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SamBooksFeatureRequest"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/agent-runs:
    get:
      operationId: listSamBooksAgentRuns
      tags: [sam-books]
      summary: Sam Books module-builder agent runs
      parameters:
        - in: query
          name: status
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Sam Books agent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SamBooksAgentRun"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /sam-books/metrics:
    get:
      operationId: getSamBooksMetrics
      tags: [sam-books]
      summary: Sam Books performance KPIs
      responses:
        "200":
          description: Sam Books metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamBooksMetrics"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
    ActionId:
      in: path
      name: actionId
      required: true
      schema:
        type: string
    SamBooksFeatureRequestId:
      in: path
      name: featureRequestId
      required: true
      schema:
        type: integer
    SamBooksAgentRunId:
      in: path
      name: agentRunId
      required: true
      schema:
        type: integer
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamUnavailable:
      description: The connected Sam Books instance could not be reached or is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        repository: { type: string }
        environment: { type: string }
        status:
          type: string
          enum: [connected, attention, revoked]
        connectedAt: { type: string, format: date-time }
        features: { type: integer }
        pendingReviews: { type: integer }
      required: [id, name, slug, repository, environment, status, connectedAt, features, pendingReviews]
    ProjectInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        repository: { type: string, minLength: 1 }
        environment: { type: string, enum: [development, staging, production] }
      required: [name, slug, repository, environment]
    Feature:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [protected, review, paused] }
        builder: { type: string }
        reviewer: { type: string }
        pendingReviews: { type: integer }
        lastChange: { type: ["string", "null"], format: date-time }
        requiresHumanSignoff: { type: boolean }
      required: [id, projectId, projectName, name, description, status, builder, reviewer, pendingReviews, lastChange, requiresHumanSignoff]
    FeatureInput:
      type: object
      properties:
        projectId: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        builder: { type: string, minLength: 1 }
        reviewer: { type: string, minLength: 1 }
      required: [projectId, name, description, builder, reviewer]
    Review:
      type: object
      properties:
        id: { type: string }
        featureId: { type: string }
        featureName: { type: string }
        projectName: { type: string }
        title: { type: string }
        summary: { type: string }
        builder: { type: string }
        reviewer: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        filesChanged: { type: integer }
        risk: { type: string, enum: [low, medium, high] }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
        decisionNote: { type: ["string", "null"] }
      required: [id, featureId, featureName, projectName, title, summary, builder, reviewer, status, filesChanged, risk, submittedAt, decidedAt, decisionNote]
    ReviewDecision:
      type: object
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, maxLength: 500 }
      required: [decision]
    Activity:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [submitted, approved, rejected, connected, revoked] }
        title: { type: string }
        detail: { type: string }
        actor: { type: string }
        occurredAt: { type: string, format: date-time }
      required: [id, kind, title, detail, actor, occurredAt]
    DashboardSummary:
      type: object
      properties:
        pendingReviews: { type: integer }
        connectedProjects: { type: integer }
        protectedFeatures: { type: integer }
        approvedThisWeek: { type: integer }
        blockedChanges: { type: integer }
        reviewSlaHours: { type: number }
        pendingManagementActions: { type: integer }
        latestReview:
          type: ["object", "null"]
          $ref: "#/components/schemas/Review"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required: [pendingReviews, connectedProjects, protectedFeatures, approvedThisWeek, blockedChanges, reviewSlaHours, pendingManagementActions, latestReview, activity]
    ManagementAction:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        actionType:
          type: string
          enum: [feature_request, create_task, update_priority, reassign_owner, change_deadline, close_task, create_milestone, update_scope]
        target: { type: string }
        description: { type: string }
        requestedBy: { type: string }
        approver: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: ["string", "null"]
          format: date
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
        decisionNote: { type: ["string", "null"] }
      required: [id, projectId, projectName, actionType, target, description, requestedBy, approver, status, priority, dueDate, submittedAt, decidedAt, decisionNote]
    ManagementActionInput:
      type: object
      properties:
        projectId: { type: string }
        actionType:
          type: string
          enum: [feature_request, create_task, update_priority, reassign_owner, change_deadline, close_task, create_milestone, update_scope]
        target: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        requestedBy: { type: string, minLength: 1 }
        approver: { type: string, minLength: 1 }
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: ["string", "null"]
          format: date
      required: [projectId, actionType, target, description, requestedBy, approver, priority]
    ManagementActionDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        note: { type: string, maxLength: 500 }
      required: [decision]
    ManagementActionAiDraftInput:
      type: object
      properties:
        prompt: { type: string, minLength: 1, maxLength: 2000 }
      required: [prompt]
    ManagementActionAiDraft:
      type: object
      properties:
        actionType:
          type: string
          enum: [feature_request, create_task, update_priority, reassign_owner, change_deadline, close_task, create_milestone, update_scope]
        target: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [low, medium, high, urgent]
      required: [actionType, target, description, priority]
    SamBooksOverview:
      type: object
      properties:
        totals:
          type: object
          properties:
            organizations: { type: integer }
            users: { type: integer }
            platformAdmins: { type: integer }
            modules: { type: integer }
            activeSubscriptions: { type: integer }
          required: [organizations, users, platformAdmins, modules, activeSubscriptions]
        organizations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              status: { type: string, enum: [active, suspended] }
              createdAt: { type: string, format: date-time }
              subscriptionStatus: { type: string }
              subscriptionHealthy: { type: boolean }
              currentPeriodEnd: { type: ["string", "null"], format: date-time }
              memberCount: { type: integer }
              transactionCount: { type: integer }
              moduleCount: { type: integer }
            required: [id, name, status, createdAt, subscriptionStatus, subscriptionHealthy, currentPeriodEnd, memberCount, transactionCount, moduleCount]
        queues:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [ingest, whatsappAgent] }
              pending: { type: integer }
              processing: { type: integer }
              failed24h: { type: integer }
              done24h: { type: integer }
              oldestPendingAgeSeconds: { type: ["integer", "null"] }
            required: [name, pending, processing, failed24h, done24h, oldestPendingAgeSeconds]
        recentFailures:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [ingest, whatsappAgent] }
              id: { type: integer }
              organizationId: { type: ["integer", "null"] }
              organizationName: { type: ["string", "null"] }
              detail: { type: string }
              error: { type: ["string", "null"] }
              at: { type: string, format: date-time }
            required: [kind, id, organizationId, organizationName, detail, error, at]
      required: [totals, organizations, queues, recentFailures]
    SamBooksProject:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        organizationId: { type: integer }
        organizationName: { type: string }
        currentRevision: { type: integer }
        createdAt: { type: string, format: date-time }
        published: { type: boolean }
        openRequests: { type: integer }
        awaitingApproval: { type: integer }
        latestRun:
          type: ["object", "null"]
          properties:
            status: { type: string }
            changeScope: { type: string }
            summary: { type: ["string", "null"] }
            error: { type: ["string", "null"] }
            createdAt: { type: string, format: date-time }
            completedAt: { type: ["string", "null"], format: date-time }
          required: [status, changeScope, summary, error, createdAt, completedAt]
      required: [id, name, organizationId, organizationName, currentRevision, createdAt, published, openRequests, awaitingApproval, latestRun]
    SamBooksFeatureRequest:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        problem: { type: string }
        outcome: { type: string }
        requirementCount: { type: integer }
        status: { type: string }
        changeScope: { type: string }
        requester:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
          required: [id, name]
        organizationId: { type: integer }
        organizationName: { type: string }
        moduleId: { type: integer }
        moduleName: { type: string }
        submittedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, problem, outcome, requirementCount, status, changeScope, requester, organizationId, organizationName, moduleId, moduleName, submittedAt, createdAt, updatedAt]
    SamBooksAgentRun:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        organizationName: { type: string }
        moduleId: { type: integer }
        moduleName: { type: string }
        requestId: { type: ["integer", "null"] }
        status: { type: string }
        changeScope: { type: string }
        prompt: { type: string }
        summary: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        createdBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        checksPassed: { type: integer }
        checksTotal: { type: integer }
        durationSeconds: { type: ["number", "null"] }
      required: [id, organizationId, organizationName, moduleId, moduleName, requestId, status, changeScope, prompt, summary, error, createdBy, createdAt, startedAt, completedAt, checksPassed, checksTotal, durationSeconds]
    SamBooksFeatureRequestDetail:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        problem: { type: string }
        outcome: { type: string }
        requirements: { type: array, items: { type: string } }
        status: { type: string }
        changeScope: { type: string }
        organization:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
          required: [id, name]
        module:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
          required: [id, name]
        requester:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: ["string", "null"] }
          required: [id, name, email]
        wireframes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              version: { type: integer }
              content: { type: string }
              createdAt: { type: string, format: date-time }
            required: [id, version, content, createdAt]
        decisions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              decision: { type: string }
              comment: { type: ["string", "null"] }
              wireframeVersion: { type: ["integer", "null"] }
              decidedBy: { type: string }
              createdAt: { type: string, format: date-time }
